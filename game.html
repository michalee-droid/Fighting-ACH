<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL ARENA — Turn-Based Battle</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141021; --panel: #221c35; --border: #f4d35e;
      --accent: #ee6c4d; --hp: #4ade80; --mp: #38bdf8; --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; image-rendering: pixelated; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .game-container { width: 100%; max-width: 820px; background: var(--panel); border: 4px solid var(--border); box-shadow: 0 0 0 4px #000, 8px 8px 0 #000; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #000; padding-bottom: 12px; margin-bottom: 16px; font-size: 11px; gap: 8px; flex-wrap: wrap; }
    .badge { background: #000; color: var(--border); padding: 6px 10px; border: 2px solid var(--border); }
    .link-btn { background: #2c2445; color: #fff; border: 2px solid #fff; padding: 6px 10px; font-size: 9px; text-decoration: none; }
    .arena { position: relative; height: 290px; background-color: #2c2543; background-image: linear-gradient(to bottom, #1e1b33 65%, #3a2e25 65%); background-size: cover; background-position: center; border: 4px solid #000; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px 40px; overflow: hidden; }
    .fighter-box { display: flex; flex-direction: column; align-items: center; width: 210px; z-index: 2; }
    .hud { width: 100%; background: rgba(0,0,0,0.85); border: 3px solid #fff; padding: 8px; margin-bottom: 12px; font-size: 9px; }
    .bar-bg { width: 100%; height: 10px; background: #333; border: 2px solid #000; margin-top: 5px; }
    .bar-fill { height: 100%; transition: width 0.3s steps(5); }
    .hp-fill { background: var(--hp); }
    .mp-fill { background: var(--mp); }
    .sprite-slot { width: 110px; height: 110px; border: 3px dashed rgba(255,255,255,0.35); background: rgba(0,0,0,0.35); display: flex; justify-content: center; align-items: center; }
    .sprite-slot img { width: 100%; height: 100%; object-fit: contain; }
    .lunge-right { animation: lungeR 0.3s steps(3); }
    .lunge-left { animation: lungeL 0.3s steps(3); }
    .hit-shake { animation: shake 0.3s steps(3); filter: brightness(2.5) sepia(1) hue-rotate(-50deg); }
    @keyframes lungeR { 50% { transform: translateX(40px); } }
    @keyframes lungeL { 50% { transform: translateX(-40px); } }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { background: #332a4d; color: #fff; border: 3px solid #fff; box-shadow: 4px 4px 0 #000; padding: 12px 8px; font-size: 9px; cursor: pointer; text-align: left; line-height: 1.5; }
    button:hover:not(:disabled) { background: var(--border); color: #000; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .log-box { background: #0d0a14; border: 3px solid #fff; padding: 10px; height: 135px; overflow-y: auto; font-size: 9px; line-height: 1.7; }
    .log-box p { margin-bottom: 6px; }
    .c-gold { color: var(--border); } .c-red { color: var(--accent); } .c-green { color: var(--hp); }
    @media (max-width: 640px) { .bottom-grid { grid-template-columns: 1fr; } .arena { padding: 16px; } }
  </style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div>PIXEL ARENA // <span id="user-display" class="c-gold">GUEST</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <a href="index.html" class="link-btn">&lt;&lt; STAT HUB</a>
      <div class="badge">WINS: <span id="win-count">0</span></div>
    </div>
  </div>

  <div class="arena" id="arena-bg">
    <div class="fighter-box">
      <div class="hud">
        <div style="display:flex; justify-content:space-between;">
          <span id="p-name">KNIGHT</span>
          <span id="p-hp-text">100/100</span>
        </div>
        <div class="bar-bg"><div class="bar-fill hp-fill" id="p-hp-bar" style="width:100%"></div></div>
        <div class="bar-bg"><div class="bar-fill mp-fill" id="p-mp-bar" style="width:100%"></div></div>
      </div>
      <div class="sprite-slot" id="player-sprite">
        <img src="" alt="PLAYER IMG" id="img-player" onerror="this.style.display='none'">
      </div>
    </div>

    <div class="fighter-box">
      <div class="hud">
        <div style="display:flex; justify-content:space-between;">
          <span id="e-name">DARK KNIGHT</span>
          <span id="e-hp-text">120/120</span>
        </div>
        <div class="bar-bg"><div class="bar-fill hp-fill" id="e-hp-bar" style="width:100%"></div></div>
      </div>
      <div class="sprite-slot" id="enemy-sprite">
        <img src="" alt="ENEMY IMG" id="img-enemy" onerror="this.style.display='none'">
      </div>
    </div>
  </div>

  <div class="bottom-grid">
    <div class="actions" id="action-buttons">
      <button onclick="playerTurn('slash')" id="btn-slash">[1] SLASH</button>
      <button onclick="playerTurn('skill')" id="btn-skill">[2] ULTIMATE</button>
      <button onclick="playerTurn('heal')" id="btn-heal">[3] POTION</button>
      <button onclick="resetBattle()" id="btn-reset" style="display:none; background:#15803d;">[R] NEXT BATTLE</button>
    </div>

    <div class="log-box" id="battle-log">
      <p class="c-gold">&gt; Pertarungan dimulai! Gunakan build stat-mu.</p>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVb25GT74o9wocY0Qptlw_KpFIYtOsfVc",
    authDomain: "anything-9d56e.firebaseapp.com",
    projectId: "anything-9d56e",
    storageBucket: "anything-9d56e.firebasestorage.app",
    messagingSenderId: "678921911596",
    appId: "1:678921911596:web:ab472bf69bdab235238089"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    currentUser = user;
    document.getElementById('user-display').textContent = user.email.split('@')[0].toUpperCase();
    const snap = await getDoc(doc(db, "players", user.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.wins) document.getElementById('win-count').textContent = data.wins;
      if (data.build && window.initFromBuild) window.initFromBuild(data.build);
    }
  });

  window.saveWinToFirebase = async () => {
    const winEl = document.getElementById('win-count');
    winEl.textContent = parseInt(winEl.textContent) + 1;
    if (currentUser) {
      await setDoc(doc(db, "players", currentUser.uid), {
        email: currentUser.email,
        wins: increment(1),
        lastPlayed: new Date().toISOString()
      }, { merge: true });
    }
  };
</script>

<script>
  // KATEGORI GAMBAR TERPADU (SAMAKAN PATH DENGAN INDEX.HTML)
  const ASSETS = {
    background: "", // Contoh: "assets/arena.png"
    classSprites: {
      knight: "", // Contoh: "assets/knight.png"
      mage: "",   // Contoh: "assets/mage.png"
      rogue: ""   // Contoh: "assets/rogue.png"
    },
    enemySprites: {
      dark_knight: "" // Contoh: "assets/boss.png"
    }
  };

  if (ASSETS.background) document.getElementById('arena-bg').style.backgroundImage = `url('${ASSETS.background}')`;
  if (ASSETS.enemySprites.dark_knight) {
    const eImg = document.getElementById('img-enemy');
    eImg.src = ASSETS.enemySprites.dark_knight;
    eImg.style.display = 'block';
  }

  let state = {
    heroClass: 'knight',
    pHp: 100, pMaxHp: 100,
    pMp: 100, pMaxMp: 100,
    bonusAtk: 15,
    eHp: 120, eMaxHp: 120,
    isPlayerTurn: true,
    gameOver: false
  };

  const logBox = document.getElementById('battle-log');
  function log(msg, cls = "") {
    const p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = msg;
    logBox.appendChild(p);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function applyPlayerSprite(heroClass, customSprite = "") {
    const src = customSprite || ASSETS.classSprites[heroClass] || "";
    const pImg = document.getElementById('img-player');
    if (src) {
      pImg.src = src;
      pImg.style.display = 'block';
    } else {
      pImg.style.display = 'none';
    }
  }

  function initFromBuild(build) {
    const maxHp = build.maxHp || ((build.vit || 5) * 20);
    const maxMp = build.maxMp || ((build.int || 5) * 20);
    const bonusAtk = typeof build.bonusAtk === 'number' ? build.bonusAtk : ((build.str || 5) * 3);
    const heroClass = build.heroClass || 'knight';

    state = {
      ...state,
      heroClass,
      pHp: maxHp, pMaxHp: maxHp,
      pMp: maxMp, pMaxMp: maxMp,
      bonusAtk,
      eHp: 120, eMaxHp: 120,
      isPlayerTurn: true,
      gameOver: false
    };

    document.getElementById('p-name').textContent = heroClass.toUpperCase();
    applyPlayerSprite(heroClass, build.sprite);
    updateUI();
  }

  function updateUI() {
    document.getElementById('p-hp-text').textContent = `${Math.max(0, state.pHp)}/${state.pMaxHp}`;
    document.getElementById('e-hp-text').textContent = `${Math.max(0, state.eHp)}/${state.eMaxHp}`;
    document.getElementById('p-hp-bar').style.width = `${Math.max(0, (state.pHp / state.pMaxHp) * 100)}%`;
    document.getElementById('p-mp-bar').style.width = `${Math.max(0, (state.pMp / state.pMaxMp) * 100)}%`;
    document.getElementById('e-hp-bar').style.width = `${Math.max(0, (state.eHp / state.eMaxHp) * 100)}%`;

    document.getElementById('btn-slash').innerHTML = `[1] SLASH<br><span class="c-gold">DMG: ${18 + state.bonusAtk}-${24 + state.bonusAtk}</span>`;
    document.getElementById('btn-skill').innerHTML = `[2] ULTIMATE<br><span class="c-gold">DMG: ${38 + state.bonusAtk} | -30MP</span>`;
    document.getElementById('btn-heal').innerHTML = `[3] POTION<br><span class="c-green">+30 HP | -20MP</span>`;

    const disableBtns = !state.isPlayerTurn || state.gameOver;
    document.querySelectorAll('#action-buttons button:not(#btn-reset)').forEach(b => b.disabled = disableBtns);
    if (!disableBtns) {
      document.getElementById('btn-skill').disabled = state.pMp < 30;
      document.getElementById('btn-heal').disabled = state.pMp < 20;
    }
  }

  function animateHit(attackerId, targetId) {
    const atk = document.getElementById(attackerId);
    const tgt = document.getElementById(targetId);
    atk.classList.add(attackerId === 'player-sprite' ? 'lunge-right' : 'lunge-left');
    setTimeout(() => {
      tgt.classList.add('hit-shake');
      setTimeout(() => {
        atk.classList.remove('lunge-right', 'lunge-left');
        tgt.classList.remove('hit-shake');
      }, 300);
    }, 150);
  }

  function playerTurn(type) {
    if (!state.isPlayerTurn || state.gameOver) return;
    state.isPlayerTurn = false;

    if (type === 'slash') {
      const dmg = Math.floor(Math.random() * 7) + 18 + state.bonusAtk;
      state.eHp -= dmg;
      state.pMp = Math.min(state.pMaxMp, state.pMp + 10);
      animateHit('player-sprite', 'enemy-sprite');
      log(`&gt; ${state.heroClass.toUpperCase()} menyerang! -${dmg} HP musuh.`, "c-gold");
    } else if (type === 'skill' && state.pMp >= 30) {
      const dmg = 38 + state.bonusAtk;
      state.pMp -= 30;
      state.eHp -= dmg;
      animateHit('player-sprite', 'enemy-sprite');
      log(`&gt; ULTIMATE! -${dmg} HP musuh!`, "c-gold");
    } else if (type === 'heal' && state.pMp >= 20) {
      state.pMp -= 20;
      state.pHp = Math.min(state.pMaxHp, state.pHp + 30);
      log(`&gt; Potion dipakai (+30 HP).`, "c-green");
    }

    updateUI();
    if (!checkEndGame()) setTimeout(enemyTurn, 900);
  }

  function enemyTurn() {
    if (state.gameOver) return;
    const isHeavy = Math.random() > 0.7;
    const dmg = isHeavy ? 26 : Math.floor(Math.random() * 6) + 12;
    state.pHp -= dmg;
    animateHit('enemy-sprite', 'player-sprite');
    log(isHeavy ? `&gt; MUSUH heavy hit -${dmg} HP!` : `&gt; MUSUH membalas -${dmg} HP.`, "c-red");
    if (!checkEndGame()) state.isPlayerTurn = true;
    updateUI();
  }

  function checkEndGame() {
    if (state.eHp <= 0) {
      state.gameOver = true;
      log("&gt; VICTORY! Musuh dikalahkan!", "c-green");
      document.getElementById('btn-reset').style.display = 'block';
      if (window.saveWinToFirebase) window.saveWinToFirebase();
      updateUI();
      return true;
    }
    if (state.pHp <= 0) {
      state.gameOver = true;
      log("&gt; DEFEAT! Kamu tumbang...", "c-red");
      document.getElementById('btn-reset').style.display = 'block';
      updateUI();
      return true;
    }
    return false;
  }

  function resetBattle() {
    state.pHp = state.pMaxHp;
    state.pMp = state.pMaxMp;
    state.eHp = state.eMaxHp;
    state.isPlayerTurn = true;
    state.gameOver = false;
    document.getElementById('btn-reset').style.display = 'none';
    logBox.innerHTML = `<p class="c-gold">&gt; Pertarungan baru dimulai!</p>`;
    updateUI();
  }

  const savedLocal = localStorage.getItem('pixel_hero_build');
  if (savedLocal) {
    try { initFromBuild(JSON.parse(savedLocal)); } catch {}
  }
  applyPlayerSprite(state.heroClass);
  updateUI();
</script>
</body>
</html>
