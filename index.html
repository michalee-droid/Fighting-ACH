<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL ARENA — Turn-Based Battle</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141021;
      --panel: #221c35;
      --border: #f4d35e;
      --accent: #ee6c4d;
      --hp: #4ade80;
      --mp: #38bdf8;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .game-container {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 4px solid var(--border);
      box-shadow: 0 0 0 4px #000, 8px 8px 0 #000;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #000;
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-size: 11px;
    }

    .badge {
      background: #000;
      color: var(--border);
      padding: 6px 10px;
      border: 2px solid var(--border);
    }

    /* ARENA & SLOT ASSET */
    .arena {
      position: relative;
      height: 290px;
      /* GANTI BACKGROUND ARENA DI SINI */
      background-color: #2c2543;
      background-image: linear-gradient(to bottom, #1e1b33 65%, #3a2e25 65%);
      background-size: cover;
      background-position: center;
      border: 4px solid #000;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 40px;
      overflow: hidden;
    }

    .fighter-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 210px;
      z-index: 2;
    }

    .hud {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #fff;
      padding: 8px;
      margin-bottom: 12px;
      font-size: 9px;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #333;
      border: 2px solid #000;
      margin-top: 5px;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.3s steps(5);
    }

    .hp-fill { background: var(--hp); }
    .mp-fill { background: var(--mp); }

    /* SLOT GAMBAR KARAKTER */
    .sprite-slot {
      width: 110px;
      height: 110px;
      border: 3px dashed rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sprite-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Animasi Serangan & Terkena Hit */
    .lunge-right { animation: lungeR 0.3s steps(3); }
    .lunge-left { animation: lungeL 0.3s steps(3); }
    .hit-shake { animation: shake 0.3s steps(3); filter: brightness(2.5) sepia(1) hue-rotate(-50deg); }

    @keyframes lungeR { 50% { transform: translateX(40px); } }
    @keyframes lungeL { 50% { transform: translateX(-40px); } }
    @keyframes shake {
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* KONTROL & LOG */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #332a4d;
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 4px 4px 0 #000;
      padding: 12px 8px;
      font-size: 9px;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
    }

    button:hover:not(:disabled) {
      background: var(--border);
      color: #000;
    }

    button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .log-box {
      background: #0d0a14;
      border: 3px solid #fff;
      padding: 10px;
      height: 135px;
      overflow-y: auto;
      font-size: 9px;
      line-height: 1.7;
    }

    .log-box p { margin-bottom: 6px; }
    .c-gold { color: var(--border); }
    .c-red { color: var(--accent); }
    .c-green { color: var(--hp); }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div>PIXEL ARENA // <span id="user-display" class="c-gold">GUEST</span></div>
    <div class="badge">WIN STREAK: <span id="win-count">0</span></div>
  </div>

  <!-- ARENA PERTARUNGAN -->
  <!-- Tips: Tambahkan style="background-image: url('bg-arena.png');" di div arena jika ingin pakai gambar latar -->
  <div class="arena" id="arena-bg">
    
    <!-- KATEGORI 1: PLAYER -->
    <div class="fighter-box">
      <div class="hud">
        <div style="display:flex; justify-content:space-between;">
          <span>HERO</span>
          <span id="p-hp-text">100/100</span>
        </div>
        <div class="bar-bg"><div class="bar-fill hp-fill" id="p-hp-bar" style="width:100%"></div></div>
        <div class="bar-bg"><div class="bar-fill mp-fill" id="p-mp-bar" style="width:100%"></div></div>
      </div>
      
      <!-- LETAKKAN FOTO PLAYER DI SRC DI BAWAH INI -->
      <div class="sprite-slot" id="player-sprite">
        <img src="" alt="PLAYER IMG" id="img-player" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- KATEGORI 2: ENEMY -->
    <div class="fighter-box">
      <div class="hud">
        <div style="display:flex; justify-content:space-between;">
          <span id="e-name">DARK KNIGHT</span>
          <span id="e-hp-text">120/120</span>
        </div>
        <div class="bar-bg"><div class="bar-fill hp-fill" id="e-hp-bar" style="width:100%"></div></div>
      </div>

      <!-- LETAKKAN FOTO MUSUH DI SRC DI BAWAH INI -->
      <div class="sprite-slot" id="enemy-sprite">
        <img src="" alt="ENEMY IMG" id="img-enemy" onerror="this.style.display='none'">
      </div>
    </div>

  </div>

  <!-- PANEL AKSI & LOG -->
  <div class="bottom-grid">
    <div class="actions" id="action-buttons">
      <button onclick="playerTurn('slash')">[1] SLASH<br><span class="c-gold">DMG: 18-24</span></button>
      <button onclick="playerTurn('skill')" id="btn-skill">[2] ULTIMATE<br><span class="c-gold">DMG: 38 | -30MP</span></button>
      <button onclick="playerTurn('heal')" id="btn-heal">[3] POTION<br><span class="c-green">+30 HP | -20MP</span></button>
      <button onclick="resetBattle()" id="btn-reset" style="display:none; background:#15803d;">[R] NEXT BATTLE</button>
    </div>

    <div class="log-box" id="battle-log">
      <p class="c-gold">> Selamat datang di Pixel Arena!</p>
      <p>> Giliranmu! Pilih aksi di sebelah kiri.</p>
    </div>
  </div>
</div>

<!-- FIREBASE SDK (MODULAR v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVb25GT74o9wocY0Qptlw_KpFIYtOsfVc",
    authDomain: "anything-9d56e.firebaseapp.com",
    projectId: "anything-9d56e",
    storageBucket: "anything-9d56e.firebasestorage.app",
    messagingSenderId: "678921911596",
    appId: "1:678921911596:web:ab472bf69bdab235238089"
  };

  // Inisialisasi Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  // Cek Status Login & Ambil Data Kemenangan dari Firestore
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('user-display').textContent = user.email.split('@')[0].toUpperCase();
      const docRef = doc(db, "players", user.uid);
      const snap = await getDoc(docRef);
      if (snap.exists() && snap.data().wins) {
        document.getElementById('win-count').textContent = snap.data().wins;
      }
    }
  });

  // Fungsi Simpan Kemenangan ke Firestore (Dipanggil saat Player menang)
  window.saveWinToFirebase = async () => {
    const winEl = document.getElementById('win-count');
    winEl.textContent = parseInt(winEl.textContent) + 1;

    if (currentUser) {
      try {
        await setDoc(doc(db, "players", currentUser.uid), {
          email: currentUser.email,
          wins: increment(1),
          lastPlayed: new Date().toISOString()
        }, { merge: true });
        log("> Data kemenangan tersimpan ke Cloud!", "c-gold");
      } catch (err) {
        console.error("Gagal menyimpan ke Firebase:", err);
      }
    }
  };
</script>

<!-- LOGIKA GAME TURN-BASED -->
<script>
  // ==========================================
  // KONFIGURASI ASET GAMBAR (ISI PATH FOTO DI SINI)
  // ==========================================
  const ASSETS = {
    background: "", // Contoh: "assets/bg-castle.png"
    player: "",     // Contoh: "assets/hero.png"
    enemy: ""       // Contoh: "assets/boss.png"
  };

  // Terapkan aset jika sudah diisi
  if (ASSETS.background) document.getElementById('arena-bg').style.backgroundImage = `url('${ASSETS.background}')`;
  if (ASSETS.player) { const img = document.getElementById('img-player'); img.src = ASSETS.player; img.style.display = 'block'; }
  if (ASSETS.enemy) { const img = document.getElementById('img-enemy'); img.src = ASSETS.enemy; img.style.display = 'block'; }

  // ==========================================
  // STATE PERTARUNGAN
  // ==========================================
  let state = {
    pHp: 100, pMaxHp: 100, pMp: 100,
    eHp: 120, eMaxHp: 120,
    isPlayerTurn: true,
    gameOver: false
  };

  const logBox = document.getElementById('battle-log');

  function log(msg, cls = "") {
    const p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = msg;
    logBox.appendChild(p);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function updateUI() {
    document.getElementById('p-hp-text').textContent = `${Math.max(0, state.pHp)}/${state.pMaxHp}`;
    document.getElementById('e-hp-text').textContent = `${Math.max(0, state.eHp)}/${state.eMaxHp}`;
    document.getElementById('p-hp-bar').style.width = `${Math.max(0, (state.pHp / state.pMaxHp) * 100)}%`;
    document.getElementById('p-mp-bar').style.width = `${Math.max(0, state.pMp)}%`;
    document.getElementById('e-hp-bar').style.width = `${Math.max(0, (state.eHp / state.eMaxHp) * 100)}%`;

    const disableBtns = !state.isPlayerTurn || state.gameOver;
    document.querySelectorAll('#action-buttons button:not(#btn-reset)').forEach(b => b.disabled = disableBtns);
    if (!disableBtns) {
      document.getElementById('btn-skill').disabled = state.pMp < 30;
      document.getElementById('btn-heal').disabled = state.pMp < 20;
    }
  }

  function animateHit(attackerId, targetId) {
    const atk = document.getElementById(attackerId);
    const tgt = document.getElementById(targetId);
    atk.classList.add(attackerId === 'player-sprite' ? 'lunge-right' : 'lunge-left');
    setTimeout(() => {
      tgt.classList.add('hit-shake');
      setTimeout(() => {
        atk.classList.remove('lunge-right', 'lunge-left');
        tgt.classList.remove('hit-shake');
      }, 300);
    }, 150);
  }

  function playerTurn(type) {
    if (!state.isPlayerTurn || state.gameOver) return;
    state.isPlayerTurn = false;

    if (type === 'slash') {
      const dmg = Math.floor(Math.random() * 7) + 18;
      state.eHp -= dmg;
      state.pMp = Math.min(100, state.pMp + 10);
      animateHit('player-sprite', 'enemy-sprite');
      log(`> HERO menyerang! -${dmg} HP musuh.`, "c-gold");
    } 
    else if (type === 'skill' && state.pMp >= 30) {
      state.pMp -= 30;
      state.eHp -= 38;
      animateHit('player-sprite', 'enemy-sprite');
      log(`> ULTIMATE SLASH! Critical -38 HP!`, "c-gold");
    } 
    else if (type === 'heal' && state.pMp >= 20) {
      state.pMp -= 20;
      state.pHp = Math.min(state.pMaxHp, state.pHp + 30);
      log(`> HERO meminum potion (+30 HP).`, "c-green");
    }

    updateUI();
    if (checkEndGame()) return;
    setTimeout(enemyTurn, 900);
  }

  function enemyTurn() {
    if (state.gameOver) return;
    const isHeavy = Math.random() > 0.7;
    const dmg = isHeavy ? 26 : Math.floor(Math.random() * 6) + 12;
    state.pHp -= dmg;

    animateHit('enemy-sprite', 'player-sprite');
    log(isHeavy ? `> MUSUH mengamuk! Heavy hit -${dmg} HP!` : `> MUSUH membalas serangan (-${dmg} HP).`, "c-red");

    if (!checkEndGame()) {
      state.isPlayerTurn = true;
    }
    updateUI();
  }

  function checkEndGame() {
    if (state.eHp <= 0) {
      state.gameOver = true;
      log("> VICTORY! Musuh dikalahkan!", "c-green");
      document.getElementById('btn-reset').style.display = 'block';
      if (window.saveWinToFirebase) window.saveWinToFirebase();
      updateUI();
      return true;
    }
    if (state.pHp <= 0) {
      state.gameOver = true;
      log("> DEFEAT! Kamu tumbang di arena...", "c-red");
      document.getElementById('btn-reset').style.display = 'block';
      updateUI();
      return true;
    }
    return false;
  }

  function resetBattle() {
    state = { pHp: 100, pMaxHp: 100, pMp: 100, eHp: 120, eMaxHp: 120, isPlayerTurn: true, gameOver: false };
    document.getElementById('btn-reset').style.display = 'none';
    logBox.innerHTML = `<p class="c-gold">> Pertarungan baru dimulai!</p>`;
    updateUI();
  }

  updateUI();
</script>
</body>
</html>
