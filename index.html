<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL ARENA — Character & Lobby</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141021;
      --panel: #221c35;
      --border: #f4d35e;
      --accent: #ee6c4d;
      --hp: #4ade80;
      --mp: #38bdf8;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 4px solid var(--border);
      box-shadow: 0 0 0 4px #000, 8px 8px 0 #000;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #000;
      padding-bottom: 12px;
      margin-bottom: 18px;
      font-size: 11px;
    }

    .badge {
      background: #000;
      color: var(--border);
      padding: 6px 10px;
      border: 2px solid var(--border);
    }

    /* GRID UTAMA: PREVIEW KIRI & STAT KANAN */
    .lobby-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      background: #171226;
      border: 3px solid #fff;
      padding: 14px;
    }

    /* SLOT AVATAR KARAKTER */
    .avatar-box {
      width: 100%;
      height: 180px;
      border: 3px dashed rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .avatar-box img {
      width: 130px;
      height: 130px;
      object-fit: contain;
    }

    .class-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .class-btn {
      background: #2c2445;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px 4px;
      font-size: 8px;
      cursor: pointer;
      text-align: center;
    }

    .class-btn.active {
      background: var(--border);
      color: #000;
      border-color: #000;
    }

    /* PANEL ALOKASI STAT */
    .points-banner {
      background: #000;
      border: 2px solid var(--border);
      padding: 10px;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #261f3d;
      border: 2px solid #000;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 10px;
    }

    .stat-info span {
      display: block;
      font-size: 8px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .stat-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-mini {
      width: 28px;
      height: 28px;
      background: #3b305c;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 2px 2px 0 #000;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-mini:hover:not(:disabled) {
      background: var(--border);
      color: #000;
    }

    .btn-mini:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* TOMBOL AKSI BAWAH */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-main {
      flex: 1;
      padding: 14px;
      font-size: 11px;
      border: 3px solid #fff;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      text-align: center;
    }

    .btn-save { background: #2563eb; color: #fff; }
    .btn-battle { background: #16a34a; color: #fff; }
    .btn-main:hover { filter: brightness(1.15); }
    .btn-main:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

    .c-gold { color: var(--border); }
    .c-green { color: var(--hp); }
    .c-blue { color: var(--mp); }

    @media (max-width: 640px) {
      .lobby-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>CHARACTER HUB // <span id="user-name" class="c-gold">GUEST</span></div>
    <div class="badge">TOTAL WINS: <span id="total-wins">0</span></div>
  </div>

  <div class="lobby-grid">
    <!-- KOLOM KIRI: FOTO KARAKTER & PILIHAN CLASS -->
    <div class="card">
      <div style="font-size:9px; margin-bottom:8px; text-align:center;" class="c-gold" id="char-title">KNIGHT</div>
      
      <!-- SLOT FOTO KARAKTER -->
      <div class="avatar-box">
        <img src="" alt="HERO SPRITE" id="hero-preview" onerror="this.style.display='none'">
      </div>

      <div style="font-size:8px; margin-bottom:6px; color:#cbd5e1;">PILIH CLASS:</div>
      <div class="class-selector">
        <button class="class-btn active" onclick="selectClass('knight')" id="cls-knight">KNIGHT</button>
        <button class="class-btn" onclick="selectClass('mage')" id="cls-mage">MAGE</button>
        <button class="class-btn" onclick="selectClass('rogue')" id="cls-rogue">ROGUE</button>
      </div>
    </div>

    <!-- KOLOM KANAN: DISTRIBUSI STAT -->
    <div class="card">
      <div class="points-banner">
        <span>STAT POINTS TERSEDIA:</span>
        <span class="c-gold" id="points-left">5</span>
      </div>

      <!-- STAT 1: VITALITY (HP) -->
      <div class="stat-row">
        <div class="stat-info">
          <strong class="c-green">VIT (MAX HP)</strong>
          <span>+20 HP per poin</span>
        </div>
        <div class="stat-controls">
          <button class="btn-mini" onclick="changeStat('vit', -1)">-</button>
          <span id="val-vit">5</span>
          <button class="btn-mini" onclick="changeStat('vit', 1)">+</button>
        </div>
      </div>

      <!-- STAT 2: STRENGTH (ATK) -->
      <div class="stat-row">
        <div class="stat-info">
          <strong class="c-gold">STR (ATTACK)</strong>
          <span>+4 Bonus DMG per poin</span>
        </div>
        <div class="stat-controls">
          <button class="btn-mini" onclick="changeStat('str', -1)">-</button>
          <span id="val-str">5</span>
          <button class="btn-mini" onclick="changeStat('str', 1)">+</button>
        </div>
      </div>

      <!-- STAT 3: INTELLIGENCE (MP) -->
      <div class="stat-row">
        <div class="stat-info">
          <strong class="c-blue">INT (MAX MP)</strong>
          <span>+15 MP per poin</span>
        </div>
        <div class="stat-controls">
          <button class="btn-mini" onclick="changeStat('int', -1)">-</button>
          <span id="val-int">5</span>
          <button class="btn-mini" onclick="changeStat('int', 1)">+</button>
        </div>
      </div>

      <!-- RINGKASAN STATUS AKHIR -->
      <div style="font-size:9px; margin-top:12px; line-height:1.8; color:#e2e8f0; border-top:2px dashed #475569; padding-top:10px;">
        TOTAL HP: <span class="c-green" id="sum-hp">100</span> | 
        BONUS ATK: <span class="c-gold" id="sum-atk">+20</span> | 
        MAX MP: <span class="c-blue" id="sum-mp">75</span>
      </div>
    </div>
  </div>

  <!-- TOMBOL SIMPAN & MASUK KE GAME.HTML -->
  <div class="footer-actions">
    <button class="btn-main btn-save" onclick="saveAndPlay(false)">[ SAVE BUILD ]</button>
    <button class="btn-main btn-battle" onclick="saveAndPlay(true)">ENTER ARENA >></button>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVb25GT74o9wocY0Qptlw_KpFIYtOsfVc",
    authDomain: "anything-9d56e.firebaseapp.com",
    projectId: "anything-9d56e",
    storageBucket: "anything-9d56e.firebasestorage.app",
    messagingSenderId: "678921911596",
    appId: "1:678921911596:web:ab472bf69bdab235238089"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  // Muat data karakter dari Firestore jika user login
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('user-name').textContent = user.email.split('@')[0].toUpperCase();
      const snap = await getDoc(doc(db, "players", user.uid));
      if (snap.exists()) {
        const data = snap.data();
        if (data.wins) document.getElementById('total-wins').textContent = data.wins;
        if (data.build) {
          window.charBuild = data.build;
          window.selectClass(data.build.heroClass || 'knight', false);
          window.renderStats();
        }
      }
    }
  });

  // Simpan Build ke Firestore & LocalStorage
  window.syncBuildToCloud = async (buildData) => {
    localStorage.setItem('pixel_hero_build', JSON.stringify(buildData));
    if (currentUser) {
      await setDoc(doc(db, "players", currentUser.uid), {
        build: buildData
      }, { merge: true });
    }
  };
</script>

<!-- LOGIKA STAT & FOTO KARAKTER -->
<script>
  // ==========================================================
  // KATEGORI FOTO KARAKTER (ISI PATH FOTO MASING-MASING CLASS)
  // ==========================================================
  const CLASS_IMAGES = {
    knight: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPfGab4JGC2HzLvYk-Zbrlm3SRN4RX9yV9-Jerfx8KFw&s=10", // Contoh: "assets/knight.png"
    mage: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReMPULobaOdAsNO7jfDZOrEv85KJBeX0PGJdanLDeXyA&s=10",   // Contoh: "assets/mage.png"
    rogue: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMHiFPUYBR4OtR9FN_sdoJlu7eeBLe5Rzc4UQjfmkAkw&s=10"   // Contoh: "assets/rogue.png"
  };

  window.charBuild = {
    heroClass: 'knight',
    points: 5,
    vit: 5,
    str: 5,
    int: 5
  };

  function selectClass(cls, resetPoints = false) {
    window.charBuild.heroClass = cls;
    document.getElementById('char-title').textContent = cls.toUpperCase();

    // Update tombol aktif
    document.querySelectorAll('.class-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('cls-' + cls).classList.add('active');

    // Ganti gambar sesuai kategori class yang dipilih
    const imgEl = document.getElementById('hero-preview');
    if (CLASS_IMAGES[cls]) {
      imgEl.src = CLASS_IMAGES[cls];
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
    }
  }

  function changeStat(stat, delta) {
    const b = window.charBuild;
    if (delta > 0 && b.points <= 0) return;
    if (delta < 0 && b[stat] <= 1) return; // Minimal 1 poin per stat

    b[stat] += delta;
    b.points -= delta;
    renderStats();
  }

  function renderStats() {
    const b = window.charBuild;
    document.getElementById('points-left').textContent = b.points;
    document.getElementById('val-vit').textContent = b.vit;
    document.getElementById('val-str').textContent = b.str;
    document.getElementById('val-int').textContent = b.int;

    // Hitung statistik akhir yang akan dikirim ke game.html
    document.getElementById('sum-hp').textContent = b.vit * 20;
    document.getElementById('sum-atk').textContent = `+${b.str * 4}`;
    document.getElementById('sum-mp').textContent = b.int * 15;
  }

  async function saveAndPlay(goToGame) {
    const b = window.charBuild;
    const payload = {
      ...b,
      maxHp: b.vit * 20,
      bonusAtk: b.str * 4,
      maxMp: b.int * 15,
      sprite: CLASS_IMAGES[b.heroClass] || ""
    };

    if (window.syncBuildToCloud) {
      await window.syncBuildToCloud(payload);
    }

    if (goToGame) {
      window.location.href = "game.html";
    } else {
      alert("Stat & Class karakter berhasil disimpan!");
    }
  }

  // Inisialisasi awal
  selectClass('knight');
  renderStats();
</script>
</body>
</html>
